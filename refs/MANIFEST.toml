# Deliberately NOT tracked — reviewed 2026-09-24. `tools/refs/contributors.sh`
# will keep surfacing these; this block is the answer, so nobody re-triages them.
#
# Aliases of repos already above (GitHub redirects the old name):
#   nordseele/octalab-notes      -> nordseele/octalab      (renamed)
#   emuyia/ems-octakit-firmware  -> emuyia/ems-octakit     (renamed)
#
# Forks of tracked repos — contributions land in the upstream we already track,
# so tracking the fork duplicates it. (octamad is the documented EXCEPTION: it
# carries material octabam records as never sent upstream.)
#   sambanks/midisc-fork, sambanks/midisc  (stale at 1.40MIDISC5 vs bkkbrls-del's 8.2)
#   sambanks/dsp56300, repeat98/octamad's own upstream mirror
#
# Out of scope — Elektron RE, but NOT the Octatrack or the Analog Rytm. Noted so
# the judgement is on record; revisit only if one starts stating OT/AR facts:
#   emuyia/ems-machinedrum-firmware, emuyia/ems-monomachine-firmware
#   joelanders/mc68k-md-mm, joelanders/gearmulator-md-mm, dsp56300/mc68k
#       (MC68331 emulators for the MD/MM — a different CPU from the OT's ColdFire)
#   dsp56300/gearmulator  (pulls dsp56300/dsp56300 in as a submodule, which we track
#       directly; the rest is JUCE plugin UI + unrelated synth emulation)
#
# Analog Rytm: no firmware-RE repo exists publicly as of 2026-09-24. The AR-side
# candidates are SysEx/data-structure libraries, not ColdFire RE, and belong to the
# sibling project (~/Documents/ar-kyoti-fw, which has no refs/ pipeline of its own):
#   bsp2/libanalogrytm       (portable SysEx library — AR pattern/kit/sound structs)
#   alisomay/rytm-rs, rytm-sys  (unofficial SDK for AR firmware 1.70)
# Our own AR work (MAIN OS 1.73) remains the only ColdFire-level AR RE we know of.
# ---------------------------------------------------------------------------
