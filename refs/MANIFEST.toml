# External Octatrack RE research — clone manifest.
#
# `tools/refs/sync.sh` reads this file, clones/fetches each repo into refs/<dir>/
# at the pinned commit, and writes the resolved hashes to refs/MANIFEST.lock.
# `tools/refs/whatsnew.sh` shows commits on the upstream default branch that are
# newer than the pin, so we know what to re-distill into reference/kb/.
#
# NOTHING under refs/ is committed except this file and MANIFEST.lock — mixed and
# absent licenses, and this project redistributes no third-party material.
# The durable asset is the distilled, attributed knowledge base in reference/kb/.
#
# Fields:
#   url    — clone URL
#   branch — upstream branch to track for whatsnew (usually main/master)
#   pin    — commit to check out; "HEAD" until first sync pins a real hash here
#   side   — which side of the machine this repo informs: coldfire | dsp | file-format | tooling
#   use    — one line: what we mine it for

[repo.octamax]
url    = "https://github.com/mxldyn/octamax.git"
branch = "main"
pin    = "HEAD"
side   = "coldfire"
use    = "upstream of this fork; container/update-chain analysis, patch/build pipeline, PERSONALIZE-menu map, the first behaviour mods. Track for new mods + newly named functions."

[repo.elektron-firmware-tool]
url    = "https://github.com/mischa85/elektron-firmware-tool.git"
branch = "main"
pin    = "HEAD"
side   = "tooling"
use    = "ELEK container pack/unpack, aPLib, .bin/.syx transports. Vendored separately in vendor/; kb only needs the format notes and any format fixes."

[repo.OctaLib]
url    = "https://github.com/snugsound/OctaLib.git"
branch = "main"
pin    = "HEAD"
side   = "file-format"
use    = "on-CF project/bank/part/arrangement struct layouts. Feeds the still-unmapped per-step trig / p-lock / sample-lock data model (NOTES Session 13 backlog)."

[repo.ems-octakit]
url    = "https://github.com/emuyia/ems-octakit.git"
branch = "main"
pin    = "HEAD"
side   = "file-format"
use    = "OPEN-SOURCED 2026-09 (commit ca3b527). 4 Parts/Bank -> 256 Kits/Project. runtime/abi.inc = ~500 named stock addresses; runtime/firmware.json = 598 guarded patch sites + 411 relocate ops; 62 .S modules + Rust patcher. No LICENSE file. -> reference/kb/octakit-abi.md."

[repo.octa-bt-pt]
url    = "https://github.com/bryantysinger/octa-bt-pt.git"
branch = "main"
pin    = "HEAD"
side   = "coldfire"
use    = "parameter-default patch tool (OS 1.40C). Locations of default-value tables in the MAIN OS image — address-map contributions."

[repo.octabam]
url    = "https://github.com/sambanks/octabam.git"
branch = "main"
pin    = "HEAD"
side   = "dsp"
use    = "adds DSP56300 effects to the MKII by patching new DSP assembly + a Python build system. The DSP side COVERAGE.md flags as out of scope here; mapped, not patched."

[repo.midisc]
url    = "https://github.com/bkkbrls-del/midisc.git"
branch = "main"
pin    = "HEAD"
side   = "coldfire"
use    = "adds MIDI track scene A/B locks + XF morph to OS 1.40C (same OS version as this project). Dense, HW-confirmed 1.40C address map (tools/midisc/memory_map.py, docs/TECH.md): MIDI page/flat resolver, part-save freeze-twin persistence pattern, XF-over-step-lock morph engine, bank-register-clobber fix. Already vendored as a submodule by octabam (modules/midi-scenes). Added 2026-09-16."

[repo.dsp56300]
url    = "https://github.com/dsp56300/dsp56300.git"
branch = "dsp56300"
pin    = "HEAD"
side   = "dsp"
use    = "THE canonical DSP56300 CPU/DSP core emulator + disassembler (GPLv3) — the actual upstream octabam vendors into vendor/dsp56300 at a hand-pinned commit (scripts/setup.sh DSP56300_PIN), not at tip. NOTE: this repo's active branch is 'dsp56300', NOT 'main' (main is stale, last commit 2026-05-25) — whatsnew/sync must track 'dsp56300'. Track directly to see how stale octabam's vendored pin is and to mine opcode/CCR-flag semantics ourselves. Added 2026-09-16."

[repo.octalab]
url    = "https://github.com/nordseele/octalab.git"
branch = "main"
pin    = "HEAD"
side   = "coldfire"
use    = "nordseele's findings-only notes repo (MIT; renamed from 'octalab-notes' — that name still redirects). THE closest match to this project: creative helper functions added to stock OS 1.40C, built and tested on an **Octatrack MKI**, same as us. Publishes no source/firmware — docs/ only: FS layer + slot loading, Parts, the card's files, step records and lock stores, the input layer, menus, the platform reserve on hardware, groove-pool (.otg) file format. octabam's own CONTRIBUTIONS.md credits this as its single largest external ColdFire-side ingest (13 Sep + 23 Sep 2026). Added 2026-09-24."

[repo.octemu]
url    = "https://github.com/markandrus/octemu.git"
branch = "main"
pin    = "HEAD"
side   = "tooling"
use    = "markandrus's QEMU-based Octatrack emulator (ColdFire MCF54455 + dsp56300 + SDL2) with an emulated front panel, CF-card image and NVRAM — a second, independent emulation route to compare ours against. Mine `re/*.syms` (~768 ColdFire + ~150 DSP symbol names) against reference/kb/memory-map.md, and his three ColdFire customisations (RECEIVE machine generalising NEIGHBOR; USB-MIDI completing the stock partial implementation; USB-Audio UAC2 16-ch post-FX tap incl. the CF-card-payload trick for code that will not fit the image). Own sources MIT; binaries are NOT redistributable (mixed licenses). Added 2026-09-24."

[repo.midisc-patcher]
url    = "https://github.com/bkkbrls-del/midisc-patcher.git"
branch = "main"
pin    = "HEAD"
side   = "tooling"
use    = "bkkbrls-del's browser-side patcher: the user supplies their OWN stock OS 1.40C and the page builds 1.40MIDISC8.1 locally. Mined for the DISTRIBUTION pattern (ship a patch recipe, never an Elektron image) that this project's FLASHING.md already follows by hand, and for its region/relocation table shape. Added 2026-09-24."

[repo.octamad]
url    = "https://github.com/repeat98/octamad.git"
branch = "main"
pin    = "HEAD"
side   = "coldfire"
use    = "Jannik Assfalg (repeat98)'s octabam fork. Tracked not as a mod but because octabam's CONTRIBUTIONS.md records that his STOCK_PROFILE.md (a ColdFire instruction profile of the STOCK firmware: frame ISR, delay, sample analysis, voice-renderer extents), his 'stock-analysis-fast' module and his '--work-profile' counter 'were not sent' upstream — i.e. that material exists only here. Also the origin of the EMAC integer-vs-fractional ACCext finding and 'FUN_4000c8a4 is not a function boundary'. Added 2026-09-24."

[repo.octamachine]
url    = "https://github.com/repeat98/octamachine.git"
branch = "main"
pin    = "HEAD"
side   = "coldfire"
use    = "repeat98's attempt to run Machinedrum UW OS 1.63 on Octatrack hardware. The Machinedrum half is out of scope; tracked ONLY for docs/BOOT_FEASIBILITY.md + docs/COMPATIBILITY_MATRIX.md, which enumerate the Octatrack's own ColdFire/DSP/memory/peripheral requirements from the host side — an independent cross-check of our boot + platform-reserve figures. Added 2026-09-24."

